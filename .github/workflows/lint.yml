name: Lint

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install linters
        run: python -m pip install --upgrade pip pyflakes

      - name: Byte-compile Python sources (Linux app)
        working-directory: linux-app
        run: python -m compileall -q .

      - name: pyflakes (Linux app)
        working-directory: linux-app
        run: python3 -m pyflakes *.py ui/*.py tray-icons/*.py

      - name: Byte-compile Python sources (Windows app)
        working-directory: windows-app
        run: python -m compileall -q .

      - name: pyflakes (Windows app)
        working-directory: windows-app
        run: python3 -m pyflakes *.py ui/*.py

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest pyserial

      - name: Run unit tests
        run: python -m pytest
