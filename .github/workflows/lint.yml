name: Lint

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install linters
        run: python -m pip install --upgrade pip pyflakes

      - name: Byte-compile Python sources (Linux app)
        working-directory: linux-app
        run: python -m compileall -q .

      - name: pyflakes (Linux app)
        working-directory: linux-app
        run: python3 -m pyflakes *.py ui/*.py tray-icons/*.py

      - name: Byte-compile Python sources (Windows app)
        working-directory: windows-app
        run: python -m compileall -q .

      - name: pyflakes (Windows app)
        working-directory: windows-app
        run: python3 -m pyflakes *.py ui/*.py

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest pyserial

      - name: Run unit tests
        run: python -m pytest

  # The Windows app is PySide6/Qt6, so it can be built on Linux with the Qt
  # `offscreen` platform plugin: this exercises the real UI construction paths
  # (window, pages, dialogs) that `compileall` cannot reach.
  smoke-test-windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Qt runtime libraries (headless)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libdbus-1-3 \
            libfontconfig1 libfreetype6 libxcb-cursor0

      - name: Install Windows app dependencies
        run: python -m pip install --upgrade pip -r windows-app/requirements.txt

      - name: Smoke test the Windows UI (offscreen)
        run: python scripts/smoke_windows.py
