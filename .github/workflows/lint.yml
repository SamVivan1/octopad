name: Lint

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install linters
        run: python -m pip install --upgrade pip pyflakes

      - name: Byte-compile Python sources
        working-directory: linux-app
        run: python -m compileall -q .

      - name: pyflakes
        working-directory: linux-app
        run: python3 -m pyflakes *.py ui/*.py tray-icons/*.py
