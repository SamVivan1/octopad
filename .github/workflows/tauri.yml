name: Tauri Build & Test

on:
  push:
    branches: [ main ]
    paths:
      - 'app-tauri/**'
      - '.github/workflows/tauri.yml'
  pull_request:
    paths:
      - 'app-tauri/**'
      - '.github/workflows/tauri.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Linux is the primary platform: Ubuntu first, then the Debian base the
  # project is mostly installed on (verified separately in the `debian` job).
  linux:
    name: Test + build Linux bundles (Ubuntu)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app-tauri
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential curl wget file pkg-config \
            libwebkit2gtk-4.1-dev libssl-dev libudev-dev \
            libayatana-appindicator3-dev librsvg2-dev \
            libxdo-dev patchelf

      - name: Set up Rust
        run: |
          rustup update stable
          rustup default stable
          rustc --version

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app-tauri/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      # cargo never touches src/, so a broken Svelte layer would still produce
      # a green run unless the frontend is checked separately.
      - name: Frontend tests (vitest)
        run: npm test

      - name: Frontend type-check (svelte-check)
        run: npm run check

      - name: Frontend build (vite)
        run: npm run build

      - name: Run core tests (with device features)
        run: cargo test -p octopad-core --manifest-path src-tauri/Cargo.toml --features serial,ble

      - name: Check core crate (with device features)
        run: cargo check -p octopad-core --manifest-path src-tauri/Cargo.toml --features serial,ble

      - name: cargo check (workspace)
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Build release bundles (deb + AppImage)
        run: npm run tauri build -- --bundles deb,appimage

      - name: Upload bundle artifact
        uses: actions/upload-artifact@v7
        with:
          name: octopad-tauri-linux-bundles
          path: |
            app-tauri/src-tauri/target/release/bundle/deb/*.deb
            app-tauri/src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

  # The app is mostly installed on Debian-derived systems. This job runs inside a
  # Debian 12 container to prove two things the Ubuntu job cannot: the runtime
  # dependencies the .deb declares actually exist there, and the package installs
  # and launches with nothing else added.
  debian:
    name: Verify .deb on Debian 12 (container)
    runs-on: ubuntu-latest
    container: debian:bookworm
    steps:
      - uses: actions/checkout@v7

      - name: Install build and runtime dependencies
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates git build-essential curl wget file pkg-config \
            libwebkit2gtk-4.1-dev libgtk-3-dev libssl-dev libudev-dev \
            libayatana-appindicator3-dev librsvg2-dev libxdo-dev patchelf \
            desktop-file-utils

      - name: Set up Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable
          # $GITHUB_PATH only affects *later* steps, so source the env here too.
          . "$HOME/.cargo/env"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          rustc --version
          cargo --version

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app-tauri/package-lock.json

      - name: Install frontend dependencies
        working-directory: app-tauri
        run: npm ci

      - name: cargo check (workspace)
        working-directory: app-tauri
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Run core tests (with device features)
        working-directory: app-tauri
        run: cargo test -p octopad-core --manifest-path src-tauri/Cargo.toml --features serial,ble

      - name: Build release bundle (deb)
        working-directory: app-tauri
        run: npm run tauri build -- --bundles deb

      - name: Verify the .deb installs and its dependencies resolve
        working-directory: app-tauri
        run: |
          # Absolute path: apt reads a bare relative path as a package name.
          DEB=$(readlink -f "$(ls src-tauri/target/release/bundle/deb/*.deb)")
          echo "--- declared dependencies ---"
          dpkg-deb -I "$DEB" | grep -E '^ (Package|Depends|Installed-Size)'
          echo "--- every dependency available in Debian 12? ---"
          MISSING=0
          for dep in $(dpkg-deb -I "$DEB" | sed -n 's/^ Depends: //p' | tr ',' '\n' | tr -d ' '); do
            PKG="${dep%% (*}"
            if ! dpkg-query -W -f='${Status}' "$PKG" 2>/dev/null | grep -q 'ok installed'; then
              if apt-get install -s --no-install-recommends "$PKG" >/dev/null 2>&1; then
                echo "  installable : $PKG"
              else
                echo "  MISSING     : $PKG"
                MISSING=1
              fi
            else
              echo "  installed   : $PKG"
            fi
          done
          test "$MISSING" -eq 0
          echo "--- install smoke check ---"
          apt-get install -y "$DEB"
          dpkg -l octo-pad | tail -1
          echo "package installed cleanly on Debian 12"

  windows:
    name: Test + build Windows bundle (Tauri)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app-tauri
    steps:
      - uses: actions/checkout@v7

      # windows-latest images ship rustup + the MSVC toolchain; pin to
      # stable so the build is reproducible without extra actions.
      - name: Set up Rust (stable, MSVC)
        run: |
          rustup update stable
          rustup default stable
          rustc --version

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app-tauri/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      # The frontend suite is the only guard for the Svelte layer: without
      # these steps a broken UI would still produce a green "artifact ready"
      # run, because cargo never touches src/.
      - name: Frontend tests (vitest)
        run: npm test

      - name: Frontend type-check (svelte-check)
        run: npm run check

      - name: Frontend build (vite)
        run: npm run build

      - name: Run core tests (with device features)
        run: cargo test -p octopad-core --manifest-path src-tauri/Cargo.toml --features serial,ble

      - name: Check core crate (with device features)
        run: cargo check -p octopad-core --manifest-path src-tauri/Cargo.toml --features serial,ble

      - name: cargo check (workspace)
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Build release bundle (NSIS + MSI)
        run: npm run tauri build

      - name: Upload bundle artifact
        uses: actions/upload-artifact@v7
        with:
          name: octopad-tauri-windows-bundle
          path: |
            app-tauri/src-tauri/target/release/bundle/nsis/*.exe
            app-tauri/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
