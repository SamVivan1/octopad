name: Tauri Build & Test

on:
  push:
    branches: [ main ]
    paths:
      - 'app-tauri/**'
      - '.github/workflows/tauri.yml'
  pull_request:
    paths:
      - 'app-tauri/**'
      - '.github/workflows/tauri.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Test + build Windows bundle (Tauri)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app-tauri
    steps:
      - uses: actions/checkout@v7

      # windows-latest images ship rustup + the MSVC toolchain; pin to
      # stable so the build is reproducible without extra actions.
      - name: Set up Rust (stable, MSVC)
        run: |
          rustup update stable
          rustup default stable
          rustc --version

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app-tauri/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      # The frontend suite is the only guard for the Svelte layer: without
      # these steps a broken UI would still produce a green "artifact ready"
      # run, because cargo never touches src/.
      - name: Frontend tests (vitest)
        run: npm test

      - name: Frontend type-check (svelte-check)
        run: npm run check

      - name: Frontend build (vite)
        run: npm run build

      - name: Run core tests (with device features)
        run: cargo test -p octopad-core --manifest-path src-tauri/Cargo.toml --features serial,ble

      - name: Check core crate (with device features)
        run: cargo check -p octopad-core --manifest-path src-tauri/Cargo.toml --features serial,ble

      - name: cargo check (workspace)
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Build release bundle (NSIS + MSI)
        run: npm run tauri build

      - name: Upload bundle artifact
        uses: actions/upload-artifact@v7
        with:
          name: octopad-tauri-windows-bundle
          path: |
            app-tauri/src-tauri/target/release/bundle/nsis/*.exe
            app-tauri/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
