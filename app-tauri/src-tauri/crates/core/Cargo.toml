[package]
name = "octopad-core"
version = "0.1.0"
edition = "2021"

[features]
serial = ["serialport", "tokio"]
ble = ["btleplug", "tokio"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
dirs = "6"
serialport = { version = "4", optional = true }
btleplug = { version = "0.11", optional = true }
tokio = { version = "1", features = ["sync", "rt", "time", "macros"], optional = true }

[dev-dependencies]
tempfile = "3"
