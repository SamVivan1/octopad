[package]
name = "octopad-core"
version = "0.1.0"
edition = "2021"

[features]
serial = ["serialport"]
ble = ["btleplug"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
dirs = "6"
serialport = { version = "4", optional = true }
btleplug = { version = "0.11", optional = true }
